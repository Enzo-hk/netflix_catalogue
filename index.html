<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Visualization</title>

  <!-- style sheet -->
<link rel="stylesheet" href="/src/styles/style.css">
  <!-- you can add other stylesheets here if you want -->
</head>

<body>
  <div id="app">

    <h1>Our amazing project!</h1>
    <div class="controls-container">
    <label class="toggle-label">
      <input type="checkbox" id="toggle-beeswarm" checked>
      Beeswarm
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="toggle-stacked" checked>
      Stacked Area Chart
    </label>
    </div>
    <!-- Example -->
    <section class="visualization" id="section-beeswarm">
      <h2>Beeswarm</h2>

      <div class="chart-container">
        <svg id="beeswarm"></svg>
      </div>
    </section>
    <section class="visualization" id="section-stacked">
      <h2>Stacked Area Chart</h2>
      <div class="chart-container">
        <svg id="stacked-area-chart"></svg>
      </div>
    </section>
    <!-- End of example -->


  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
