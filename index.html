<!doctype html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <!-- Load d3.js -->
  <script src="https://d3js.org/d3.v6.js"></script>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Visualization</title>

  <!-- style sheet -->
  <link rel="stylesheet" href="src/styles/style.css">
  <link rel="stylesheet" href="src/styles/beeswarm.css">
  <link rel="stylesheet" href="/src/styles/sunburst.css">
  <link rel="stylesheet" href="/src/styles/tab-list.css">
  <!-- you can add other stylesheets here if you want -->
</head>

<body>
  <div id="app">

    <h1>Our amazing project!</h1>
    <!-- Label Toggles -->
    <div class="controls-container">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-beeswarm" checked>
        Beeswarm
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-stacked" checked>
        Stacked Area Chart
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-choropleth" checked>
        Choropleth
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-parallel" checked>
        Parallel Coordinates
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-sunburst" checked>
        Sunburst
      </label>

    </div>

    <!-- Visualization Sections -->
    <section class="visualization" id="section-beeswarm">
      <h2>Beeswarm</h2>

      <div class="beeswarm-controls">
        <label for="person-search">Filter by actor or director</label>
        <input id="person-search" type="search" list="person-suggestions" placeholder="Start typing a name..."
          autocomplete="off">
        <datalist id="person-suggestions"></datalist>
        <output id="beeswarm-result-count" aria-live="polite"></output>
      </div>

      <div class="visualization-content">
        <div class="chart-container">
          <svg id="beeswarm"></svg>
        </div>
        <div id="tabs-beeswarm"></div>
      </div>

      <div id="beeswarm-tooltip" class="tooltip"></div>
    </section>
    <section class="visualization" id="section-stacked">
      <h2>Stacked Area Chart</h2>
      <div class="visualization-content">
        <div class="chart-container">
          <svg id="stacked-area-chart"></svg>
        </div>
        <div id="tabs-stacked"></div>
      </div>
    </section>
    <section class="visualization" id="section-choropleth">
      <h2>Choropleth</h2>

      <div class="visualization-content">
        <div class="chart-container">
          <svg id="choropleth" width="1000" height="700"></svg>
        </div>
        <div id="tabs-choropleth"></div>
      </div>
    </section>
    <section class="visualization" id="section-parallel">
      <h2>Parallel Coordinates</h2>
      <div class="visualization-content">
        <div class="chart-container">
          <svg id="parallel-coordinates"></svg>
        </div>
        <div id="tabs-parallel"></div>
      </div>
    </section>
    <section class="visualization" id="section-sunburst">
      <h2>Sunburst</h2>
      <div class="visualization-content">
        <div class="chart-container">
          <div id="sunburst"></div>
        </div>
        <div id="tabs-sunburst"></div>
      </div>
    </section>


  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
